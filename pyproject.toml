[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "q2v-agent"
version = "0.1.0"
description = "Query-to-Visualization Clinical Trials Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "adapters", "app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Ensures the project root (where models.py, ports.py live) is on sys.path
pythonpath = ["."]
